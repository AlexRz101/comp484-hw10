<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        This is your Giga Pet
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
        <img class="pet-image" src="images/hound.jpg" alt="Rex">
      </section>
      <section class="dashboard">
        <p id="pet-comment"></p>
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div>Energy: <strong><span class="energy"></span> current energy level</strong></div>
        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <button class="nap-button">
            Nap
          </button>
          <button class="sleep-button">
            Sleep
          </button>
        </div>
      </section>
    </main>

    <!-- DevTools homework demo controls -->
    <div id="devtools-demo">
      <h2>DevTools Demo</h2>
      <button id="btn-404">Trigger 404</button>
      <button id="btn-typeerror">Trigger TypeError</button>
      <button id="btn-violation">Trigger Violation</button>
      <br><br>
      <label for="treat-count">Treats:</label>
      <input id="treat-count" type="number" value="3">
      <button id="btn-debug">Add treats to weight</button>
      <p id="debug-result"></p>
    </div>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
